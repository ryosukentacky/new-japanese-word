<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語単語帳｜全10語</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#202b3a;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#183f66;color:white;padding:24px 18px}header>div,main{max-width:960px;margin:auto}header h1{margin:0 0 8px}header p{margin:0;line-height:1.7}main{padding:18px 14px 60px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}input,select,button{font:inherit;padding:11px;border:1px solid #b8c9da;border-radius:10px;background:white}input{flex:1;min-width:170px}button{cursor:pointer}button.active{background:#1766a0;color:white;border-color:#1766a0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{flex:1;min-width:64px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}.card{background:white;border:1px solid #dce5ef;border-radius:16px;padding:17px;box-shadow:0 4px 14px #183f6612}.card h2{margin:0 0 10px;font-size:1.25rem}.card .section{font-size:.96rem;line-height:1.85;overflow-wrap:anywhere}.section h1{font-size:1.2rem}.section h2{font-size:1.08rem;margin:16px 0 7px}.section h3{font-size:1rem}.section p{margin:9px 0}.section ul{padding-left:22px}.section table{display:block;overflow-x:auto;border-collapse:collapse;width:100%}.section td,.section th{border:1px solid #d8e2ec;padding:6px}.section img{width:100%;height:auto;border-radius:12px}.section figure{margin:12px 0}.source{white-space:pre-wrap;font-size:.75rem;overflow:auto}.quiz{border-top:1px solid #e2e8f0;margin-top:16px;padding-top:10px}.quiz fieldset{border:1px solid #dce5ef;border-radius:9px;margin:10px 0;padding:10px}.quiz label{display:block;padding:5px}.feedback{padding:7px;background:#eef5fb;border-radius:8px}.minor{color:#52667c;font-size:.85rem}.empty{padding:25px}.foot{margin-top:25px;font-size:.85rem;color:#54677a}@media(max-width:520px){.cards{display:block}.card{margin-bottom:13px}header{padding:20px 14px}}
</style></head><body><header><div><h1>日本語単語帳｜全10語</h1><p>A 要点 / B 詳しい解説 / C イメージ理解 / D 具体例・類義語・理解確認・復習</p></div></header><main><div class="controls"><input id="search" type="search" placeholder="単語・本文を検索"><select id="filter"><option value="all">すべて</option><option value="star">お気に入り</option><option value="done">学習済み</option></select><span id="count" class="minor"></span></div><div class="tabs" id="tabs"></div><div class="cards" id="cards"></div><p class="foot">収録した文章は提供されたチャット書き出しを基にしています。元データに表示用コードが混入した箇所は「元の対話型表示コード」として保持しています。理解確認の選択式UIはGitHub Pages向けに再実装しました。</p></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id);let tab='A';const safeKey='vocab10_v1';let state={};try{state=JSON.parse(localStorage.getItem(safeKey)||'{}')}catch(e){};const save=()=>{try{localStorage.setItem(safeKey,JSON.stringify(state))}catch(e){}};
function render(){ $('tabs').innerHTML=['A','B','C','D','全部'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const query=$('search').value.toLowerCase(),f=$('filter').value;const items=VOCAB.filter(x=>(x.word+x.sections.A+x.sections.B+x.sections.C+x.sections.D).toLowerCase().includes(query)&& (f==='all'||(f==='star'&&state[x.number]?.star)||(f==='done'&&state[x.number]?.done)));$('count').textContent=items.length+' / '+VOCAB.length+'語';$('cards').innerHTML=items.map(x=>{let st=state[x.number]||{};let html=(tab==='全部'?['A','B','C','D']:[tab]).map(k=>`<section class="section"><div class="minor">${k}</div>${x.sections[k]}</section>`).join('');return `<article class="card" data-id="${x.number}"><h2>${x.number}. ${x.word}</h2><div class="controls"><button class="star">${st.star?'★':'☆'} お気に入り</button><button class="done">${st.done?'✓ 学習済み':'学習済みにする'}</button></div>${html}<div class="quiz"><button class="quiz-toggle">理解確認3問を${st.show?'閉じる':'開く'}</button><div class="quiz-body" ${st.show?'':'hidden'}></div></div></article>`}).join('')||'<p class="empty">該当するカードがありません。</p>';
$('cards').querySelectorAll('.card').forEach(card=>{let id=+card.dataset.id,st=state[id]||{};card.querySelector('.star').onclick=()=>{state[id]={...st,star:!st.star};save();render()};card.querySelector('.done').onclick=()=>{state[id]={...st,done:!st.done};save();render()};card.querySelector('.quiz-toggle').onclick=()=>{state[id]={...st,show:!st.show};save();render()};if(st.show){let box=card.querySelector('.quiz-body');box.innerHTML=QUIZZES[id-1].map((q,j)=>`<fieldset><legend>Q${j+1}. ${q[0]}</legend>${q[1].map((opt,k)=>`<label><input type="radio" name="q${id}_${j}" value="${k}"> ${opt}</label>`).join('')}<div class="feedback" hidden></div></fieldset>`).join('')+'<button class="reset">もう一度挑戦</button>';box.querySelectorAll('fieldset').forEach((fs,j)=>{fs.querySelectorAll('input').forEach(input=>input.onchange=()=>{let q=QUIZZES[id-1][j],answer=q[1][+input.value],good=answer===q[2],feedback=fs.querySelector('.feedback');feedback.hidden=false;feedback.textContent=(good?'正解です。':'もう一度確認しましょう。')+' 正解：'+q[2]+'。';});});box.querySelector('.reset').onclick=()=>{box.querySelectorAll('input').forEach(x=>x.checked=false);box.querySelectorAll('.feedback').forEach(x=>x.hidden=true)}}});} $('search').oninput=render;$('filter').onchange=render;render();
</script></body></html>

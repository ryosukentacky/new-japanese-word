<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語単語帳｜10語</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#20334e;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4b8eff;outline-offset:2px}.top{background:white;border-bottom:1px solid #dbe4f0;padding:14px 20px;position:sticky;top:0;z-index:4}.top-inner{max-width:1300px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:850;font-size:1.3rem;color:#153a74}.tagline{color:#657790;font-size:.8rem}.search{margin-left:auto;min-width:170px;max-width:310px;width:25%;padding:10px 13px;border:1px solid #cad7e8;border-radius:11px}.shell{max-width:1300px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding:20px}.sidebar,.content{background:white;border:1px solid #e0e8f2;border-radius:18px;box-shadow:0 5px 20px #1a45700a}.sidebar{padding:12px;align-self:start;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}.nav-item{width:100%;display:flex;gap:9px;align-items:center;border:0;background:#f7f9fd;padding:12px;margin:5px 0;text-align:left;border-radius:11px;color:#284262}.nav-item.active{background:#176ae9;color:white;font-weight:750}.num{border-radius:50%;background:#e2ebfb;color:#215ab4;min-width:27px;height:27px;display:grid;place-items:center;font-weight:750}.active .num{background:white;color:#176ae9}.content{padding:25px;min-width:0}.eyebrow{font-size:.82rem;color:#547199;font-weight:750}.heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.heading h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:3px 0}.hero-num{background:#176ae9;color:white;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:1.5rem;font-weight:850}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button,.navbtn{padding:10px 14px;border:1px solid #c8d7eb;background:#fff;border-radius:10px}.toolbar button.active{background:#eaf3ff;border-color:#176ae9;color:#0759c9}.hero{width:100%;max-height:430px;object-fit:contain;border-radius:16px;background:#edf3fa;border:1px solid #e4eaf3}.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.tabbar button{border:0;border-radius:11px;padding:13px 4px;background:#edf2f9;font-weight:800;color:#334d70}.tabbar button.active{background:#176ae9;color:white}.panel{border:1px solid #dce6f2;border-radius:15px;padding:20px;background:#fcfdff;line-height:1.95;overflow-wrap:anywhere}.panel h1{font-size:1.4rem}.panel h2{font-size:1.15rem;margin:20px 0 8px;color:#1258b7}.panel h3{font-size:1.04rem;color:#315b8c}.panel p{margin:10px 0}.panel ul{padding-left:24px}.panel table{display:block;overflow-x:auto;border-collapse:collapse}.panel th,.panel td{border:1px solid #d8e3f0;padding:7px}.panel img{width:100%;max-height:440px;object-fit:contain;border-radius:12px}.panel figure{margin:12px 0}.panel figcaption{font-size:.85rem;color:#65778b}.panel .minor{font-size:.8rem;color:#60748b}.panel strong{background:linear-gradient(transparent 65%,#fff0aa 65%)}.quiz{margin-top:18px;border:1px solid #f1d9df;border-radius:15px;padding:18px;background:#fffafb}.quiz h2{margin:0 0 12px;font-size:1.1rem;color:#bd3153}.quiz fieldset{border:1px solid #eadce3;border-radius:11px;margin:13px 0;padding:13px}.quiz legend{font-weight:750}.quiz label{display:block;padding:8px;border-radius:8px;cursor:pointer}.quiz label:hover{background:#fff0f4}.quiz input{margin-right:7px}.feedback{background:#f2f6fb;border-radius:8px;padding:10px;margin-top:7px}.bottomnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.bottomnav button{flex:1;background:#eaf2ff;color:#1556a9;border:0;border-radius:11px;padding:14px;font-weight:750}.bottomnav button:disabled{opacity:.35;cursor:default}.muted{color:#65778b}.empty{padding:30px}.foot{max-width:1300px;margin:0 auto 30px;padding:0 20px;font-size:.8rem;color:#66778b}@media(max-width:720px){.top{position:static}.top-inner{gap:6px}.search{width:100%;max-width:none;margin:10px 0 0}.shell{display:block;padding:10px}.sidebar{position:static;max-height:none;display:flex;overflow-x:auto;gap:7px;padding:9px;margin-bottom:10px}.nav-item{white-space:nowrap;width:auto;flex:none;margin:0;padding:9px}.content{padding:14px}.tabbar{gap:4px}.tabbar button{padding:11px 2px;font-size:.83rem}.panel{padding:13px}.hero{max-height:270px}.heading h1{font-size:1.7rem}}
</style></head><body><header class="top"><div class="top-inner"><div><div class="brand">📖 日本語単語帳</div><div class="tagline">イメージで覚える・理解して定着する</div></div><span id="progress" class="muted"></span><input id="search" class="search" type="search" placeholder="単語や説明を検索" aria-label="単語検索"></div></header><main class="shell"><nav id="sidebar" class="sidebar" aria-label="単語一覧"></nav><article id="content" class="content"></article></main><p class="foot">10語収録。元の解説データは保持し、表示と画像を改善しています。最初の3語の画像は今回新規作成した学習用イラストです。学習記録はお使いのブラウザに保存されます。</p><script src="data.js"></script><script>
const $=id=>document.getElementById(id);let index=0,tab='A',filter='';let state={};try{state=JSON.parse(localStorage.getItem('vocab10_v1')||'{}')}catch(e){}const save=()=>{try{localStorage.setItem('vocab10_v1',JSON.stringify(state))}catch(e){}};
const imageFor=w=>{let m=w.sections.C.match(/src="([^"]+\.png)"/);return m?m[1]:''};
const display=s=>s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/&lt;text[^&]*?&gt;/g,'<span class="minor">').replace(/&lt;\/text&gt;/g,'</span>');
function render(){let matches=VOCAB.map((w,i)=>({w,i})).filter(({w})=>(w.word+Object.values(w.sections).join('')).toLowerCase().includes(filter));if(matches.length&&!matches.some(x=>x.i===index))index=matches[0].i;let w=VOCAB[index],st=state[w.number]||{};$('progress').textContent=`${VOCAB.filter(x=>state[x.number]?.done).length} / ${VOCAB.length}語 学習済み`;$('sidebar').innerHTML=matches.map(({w:x,i})=>`<button class="nav-item ${i===index?'active':''}" data-i="${i}"><span class="num">${x.number}</span>${x.word}${state[x.number]?.done?' ✓':''}</button>`).join('')||'<p class="empty">見つかりません</p>';$('sidebar').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();window.scrollTo({top:0,behavior:'smooth'})});let html=(tab==='ALL'?['A','B','C','D']:[tab]).map(k=>`<section class="panel"><div class="eyebrow">${{A:'A｜要点',B:'B｜詳しい解説',C:'C｜イメージ理解',D:'D｜具体例・復習'}[k]}</div>${display(w.sections[k])}</section>`).join('');$('content').innerHTML=`<div class="eyebrow">単語カード ${w.number} / ${VOCAB.length}</div><div class="heading"><span class="hero-num">${w.number}</span><h1>${w.word}</h1></div><div class="toolbar"><button id="star">${st.star?'★ お気に入り':'☆ お気に入り'}</button><button id="done">${st.done?'✓ 学習済み':'□ 学習済みにする'}</button></div><img class="hero" src="${imageFor(w)}" alt="${w.word}のイメージ画像"><div class="tabbar">${['A','B','C','D','ALL'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t==='ALL'?'全部':t}</button>`).join('')}</div>${html}<section class="quiz"><h2>✏️ 理解確認｜3問</h2><div id="quizbody"></div><button id="reset" class="navbtn">もう一度挑戦する</button></section><div class="bottomnav"><button id="prev" ${index===0?'disabled':''}>← 前の単語</button><button id="next" ${index===VOCAB.length-1?'disabled':''}>次の単語 →</button></div>`;
$('star').onclick=()=>{state[w.number]={...st,star:!st.star};save();render()};$('done').onclick=()=>{state[w.number]={...st,done:!st.done};save();render()};$('content').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('prev').onclick=()=>{index--;render();window.scrollTo(0,0)};$('next').onclick=()=>{index++;render();window.scrollTo(0,0)};
let quiz=QUIZZES[w.number-1];function buildQuiz(){let box=$('quizbody');box.innerHTML=quiz.map((q,j)=>`<fieldset><legend>Q${j+1}. ${q[0]}</legend>${q[1].map((opt,k)=>`<label><input type="radio" name="q${j}" value="${k}">${opt}</label>`).join('')}<div class="feedback" hidden></div></fieldset>`).join('');box.querySelectorAll('fieldset').forEach((fs,j)=>fs.querySelectorAll('input').forEach(input=>input.onchange=()=>{let q=quiz[j],ok=q[1][+input.value]===q[2],f=fs.querySelector('.feedback');f.hidden=false;f.textContent=(ok?'✓ 正解です。':'✗ 不正解です。')+' 正解：'+q[2]+'。'}))}buildQuiz();$('reset').onclick=buildQuiz}
$('search').oninput=e=>{filter=e.target.value.toLowerCase();render()};render();
</script></body></html>
